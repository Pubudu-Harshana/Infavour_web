<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="flBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02140d" />
      <stop offset="50%" stop-color="#042318" />
      <stop offset="100%" stop-color="#010a06" />
    </linearGradient>
    <linearGradient id="flEmeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#00C6FF" />
    </linearGradient>
    <linearGradient id="flCardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(10, 45, 30, 0.7)" />
      <stop offset="100%" stop-color="rgba(3, 20, 13, 0.9)" />
    </linearGradient>
    <filter id="flGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#flBg)" />

  <!-- Grid overlay -->
  <g opacity="0.1">
    <path d="M0,60 L800,60 M0,120 L800,120 M0,180 L800,180 M0,240 L800,240 M0,300 L800,300 M0,360 L800,360 M0,420 L800,420 M0,480 L800,480 M0,540 L800,540" stroke="#10B981" stroke-width="1" />
    <path d="M80,0 L80,600 M160,0 L160,600 M240,0 L240,600 M320,0 L320,600 M400,0 L400,600 M480,0 L480,600 M560,0 L560,600 M640,0 L640,600 M720,0 L720,600" stroke="#00C6FF" stroke-width="1" />
  </g>

  <!-- Ambient Glow -->
  <circle cx="180" cy="140" r="160" fill="#10B981" opacity="0.15" filter="url(#flGlow)" />
  <circle cx="680" cy="460" r="190" fill="#00C6FF" opacity="0.12" filter="url(#flGlow)" />

  <!-- Main Window Frame -->
  <rect x="50" y="50" width="700" height="500" rx="18" fill="#041810" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1.5" />

  <!-- Top Bar -->
  <rect x="50" y="50" width="700" height="56" rx="18" fill="#072418" />
  <circle cx="80" cy="78" r="6" fill="#FF5F56" />
  <circle cx="100" cy="78" r="6" fill="#FFBD2E" />
  <circle cx="120" cy="78" r="6" fill="#27C93F" />

  <!-- Logo -->
  <text x="160" y="84" font-family="'Outfit', sans-serif" font-size="17" font-weight="900" fill="#FFFFFF" letter-spacing="1">FRESH<tspan fill="#10B981">LYNC</tspan><tspan font-size="11" fill="#00C6FF" font-weight="600">.LIVE</tspan></text>
  <text x="350" y="82" font-family="'Outfit', sans-serif" font-size="12" fill="#FFFFFF" opacity="0.8">Live Tracking</text>
  <text x="460" y="82" font-family="'Outfit', sans-serif" font-size="12" fill="#FFFFFF" opacity="0.5">Cold Chain</text>
  <text x="560" y="82" font-family="'Outfit', sans-serif" font-size="12" fill="#FFFFFF" opacity="0.5">Suppliers</text>

  <!-- Live Status Pulse -->
  <rect x="635" y="66" width="95" height="26" rx="13" fill="rgba(16,185,129,0.2)" stroke="#10B981" stroke-width="1" />
  <circle cx="652" cy="79" r="4" fill="#10B981" />
  <text x="686" y="83" font-family="'Outfit', sans-serif" font-size="11" font-weight="700" fill="#10B981" text-anchor="middle">LIVE SYNC</text>

  <!-- Title & Intro -->
  <text x="85" y="145" font-family="'Outfit', sans-serif" font-size="12" fill="#10B981" font-weight="800" letter-spacing="2">INTELLIGENT SUPPLY CHAIN &amp; DISTRIBUTION</text>
  <text x="85" y="180" font-family="'Outfit', sans-serif" font-size="28" font-weight="900" fill="#FFFFFF">Direct Sourcing &amp; Cold-Chain Network</text>
  <text x="85" y="210" font-family="'Outfit', sans-serif" font-size="13" fill="#80B89C">Real-time inventory control, monitored temperature handoffs, and sustainable global imports.</text>

  <!-- Realtime Telemetry Stats Bar -->
  <g transform="translate(85, 230)">
    <!-- Stat 1 -->
    <rect width="150" height="38" rx="8" fill="rgba(16,185,129,0.12)" stroke="rgba(16,185,129,0.3)" stroke-width="1" />
    <text x="15" y="24" font-family="'Outfit', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Temp: <tspan fill="#10B981">+3.8°C</tspan> (Optimal)</text>

    <!-- Stat 2 -->
    <g transform="translate(160, 0)">
      <rect width="165" height="38" rx="8" fill="rgba(0,198,255,0.12)" stroke="rgba(0,198,255,0.3)" stroke-width="1" />
      <text x="15" y="24" font-family="'Outfit', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Active Routes: <tspan fill="#00C6FF">48 In-Transit</tspan></text>
    </g>

    <!-- Stat 3 -->
    <g transform="translate(335, 0)">
      <rect width="165" height="38" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
      <text x="15" y="24" font-family="'Outfit', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Verified Batches: <tspan fill="#A7F3D0">100%</tspan></text>
    </g>
  </g>

  <!-- Dashboard Cards Row -->
  <!-- Card 1: Cold Chain Telemetry -->
  <g transform="translate(85, 285)">
    <rect width="200" height="225" rx="14" fill="url(#flCardBg)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1.5" />
    <text x="18" y="32" font-family="'Outfit', sans-serif" font-size="11" font-weight="800" fill="#10B981">COLD-CHAIN INTEGRITY</text>
    <text x="18" y="58" font-family="'Outfit', sans-serif" font-size="15" font-weight="800" fill="#FFFFFF">Refrigerated Fleet</text>
    <text x="18" y="78" font-family="'Outfit', sans-serif" font-size="11" fill="#75A88E">IoT temperature sensors stream telemetry every 30 seconds.</text>
    
    <!-- Mini Temperature Wave -->
    <path d="M 20,135 Q 50,115 80,130 T 140,125 T 180,135" fill="none" stroke="#10B981" stroke-width="2.5" />
    <path d="M 20,135 Q 50,115 80,130 T 140,125 T 180,135 L 180,165 L 20,165 Z" fill="rgba(16,185,129,0.15)" />
    
    <text x="18" y="180" font-family="'Outfit', sans-serif" font-size="12" font-weight="800" fill="#10B981">Zero Cold-Chain Loss</text>
    <rect x="18" y="190" width="164" height="24" rx="6" fill="rgba(16,185,129,0.2)" stroke="#10B981" stroke-width="1" />
    <text x="100" y="206" font-family="'Outfit', sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">View Sensor Logs</text>
  </g>

  <!-- Card 2: Live Routing & Dispatch -->
  <g transform="translate(298, 285)">
    <rect width="200" height="225" rx="14" fill="url(#flCardBg)" stroke="rgba(0, 198, 255, 0.4)" stroke-width="1.5" />
    <text x="18" y="32" font-family="'Outfit', sans-serif" font-size="11" font-weight="800" fill="#00C6FF">LIVE GPS ROUTING</text>
    <text x="18" y="58" font-family="'Outfit', sans-serif" font-size="15" font-weight="800" fill="#FFFFFF">Dispatch to Doorstep</text>
    <text x="18" y="78" font-family="'Outfit', sans-serif" font-size="11" fill="#75A88E">Dynamic route optimization and monitored handover checkpoints.</text>
    
    <!-- Route Waypoint nodes -->
    <circle cx="35" cy="135" r="5" fill="#00C6FF" />
    <line x1="40" y1="135" x2="85" y2="125" stroke="#00C6FF" stroke-width="2" stroke-dasharray="3,3" />
    <circle cx="90" cy="125" r="5" fill="#10B981" />
    <line x1="95" y1="125" x2="145" y2="140" stroke="#00C6FF" stroke-width="2" stroke-dasharray="3,3" />
    <circle cx="150" cy="140" r="6" fill="#00C6FF" />
    
    <text x="18" y="180" font-family="'Outfit', sans-serif" font-size="12" font-weight="800" fill="#00C6FF">Estimated Delivery: On Time</text>
    <rect x="18" y="190" width="164" height="24" rx="6" fill="rgba(0,198,255,0.2)" stroke="#00C6FF" stroke-width="1" />
    <text x="100" y="206" font-family="'Outfit', sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">Track Shipment</text>
  </g>

  <!-- Card 3: Direct Sourcing & Inventory -->
  <g transform="translate(512, 285)">
    <rect width="198" height="225" rx="14" fill="url(#flCardBg)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1.5" />
    <text x="18" y="32" font-family="'Outfit', sans-serif" font-size="11" font-weight="800" fill="#10B981">VERIFIED SUPPLIERS</text>
    <text x="18" y="58" font-family="'Outfit', sans-serif" font-size="15" font-weight="800" fill="#FFFFFF">Direct Farm Sourcing</text>
    <text x="18" y="78" font-family="'Outfit', sans-serif" font-size="11" fill="#75A88E">Batch readiness, seafood, fruits &amp; spice export certs.</text>
    
    <!-- Mini progress bars -->
    <text x="18" y="125" font-family="'Outfit', sans-serif" font-size="10" fill="#A7F3D0">Stock Readiness (94%)</text>
    <rect x="18" y="132" width="160" height="6" rx="3" fill="rgba(255,255,255,0.1)" />
    <rect x="18" y="132" width="150" height="6" rx="3" fill="#10B981" />

    <text x="18" y="155" font-family="'Outfit', sans-serif" font-size="10" fill="#A7F3D0">Eco-Friendly Packaging</text>
    <rect x="18" y="162" width="160" height="6" rx="3" fill="rgba(255,255,255,0.1)" />
    <rect x="18" y="162" width="160" height="6" rx="3" fill="#00C6FF" />

    <rect x="18" y="190" width="162" height="24" rx="6" fill="rgba(16,185,129,0.2)" stroke="#10B981" stroke-width="1" />
    <text x="99" y="206" font-family="'Outfit', sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">Manage Inventory</text>
  </g>
</svg>

