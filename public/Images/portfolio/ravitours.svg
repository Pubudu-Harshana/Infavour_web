<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="rtBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05121e" />
      <stop offset="50%" stop-color="#0a1d30" />
      <stop offset="100%" stop-color="#030911" />
    </linearGradient>
    <linearGradient id="rtCyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00C6FF" />
      <stop offset="100%" stop-color="#0072FF" />
    </linearGradient>
    <linearGradient id="rtGoldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>
    <linearGradient id="rtCardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(15, 38, 64, 0.7)" />
      <stop offset="100%" stop-color="rgba(6, 18, 32, 0.9)" />
    </linearGradient>
    <filter id="rtGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#rtBg)" />

  <!-- Ambient Glows -->
  <circle cx="200" cy="150" r="180" fill="#00C6FF" opacity="0.12" filter="url(#rtGlow)" />
  <circle cx="650" cy="450" r="200" fill="#F59E0B" opacity="0.08" filter="url(#rtGlow)" />

  <!-- App Window Frame -->
  <rect x="50" y="50" width="700" height="500" rx="18" fill="#091829" stroke="rgba(0, 198, 255, 0.3)" stroke-width="1.5" />

  <!-- Top Navigation Bar -->
  <rect x="50" y="50" width="700" height="56" rx="18" fill="#0c2038" />
  <circle cx="80" cy="78" r="6" fill="#FF5F56" />
  <circle cx="100" cy="78" r="6" fill="#FFBD2E" />
  <circle cx="120" cy="78" r="6" fill="#27C93F" />

  <!-- Logo -->
  <text x="160" y="84" font-family="'Outfit', sans-serif" font-size="16" font-weight="900" fill="#FFFFFF" letter-spacing="1">RAVI TOURS<tspan fill="#00C6FF"> &amp; TRAVELS</tspan></text>
  <text x="360" y="82" font-family="'Outfit', sans-serif" font-size="12" fill="#FFFFFF" opacity="0.8">Tours &amp; Packages</text>
  <text x="475" y="82" font-family="'Outfit', sans-serif" font-size="12" fill="#FFFFFF" opacity="0.5">Destinations</text>
  <text x="560" y="82" font-family="'Outfit', sans-serif" font-size="12" fill="#FFFFFF" opacity="0.5">Safaris</text>

  <!-- WhatsApp Inquire Button -->
  <rect x="625" y="66" width="105" height="26" rx="13" fill="#25D366" />
  <text x="677" y="83" font-family="'Outfit', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">Plan on WhatsApp</text>

  <!-- Hero Content inside Mockup -->
  <text x="85" y="145" font-family="'Outfit', sans-serif" font-size="12" fill="#F59E0B" font-weight="800" letter-spacing="2">CEYLON EXPEDITIONS &amp; PRIVATE DRIVER TOURS</text>
  <text x="85" y="180" font-family="'Outfit', sans-serif" font-size="28" font-weight="900" fill="#FFFFFF">Discover The Wonders of Sri Lanka</text>
  <text x="85" y="210" font-family="'Outfit', sans-serif" font-size="13" fill="#8EAECF">Customized private itineraries, UNESCO heritage tours, wildlife safaris, and luxury airport transfers.</text>

  <!-- Badges -->
  <rect x="85" y="226" width="115" height="24" rx="12" fill="rgba(0,198,255,0.15)" stroke="#00C6FF" stroke-width="1" />
  <text x="142" y="242" font-family="'Outfit', sans-serif" font-size="11" font-weight="700" fill="#00C6FF" text-anchor="middle">★ 4.9/5 Rating (500+)</text>

  <rect x="210" y="226" width="135" height="24" rx="12" fill="rgba(245,158,11,0.15)" stroke="#F59E0B" stroke-width="1" />
  <text x="277" y="242" font-family="'Outfit', sans-serif" font-size="11" font-weight="700" fill="#F59E0B" text-anchor="middle">100% Tailor-Made</text>

  <!-- Destination Cards Row -->
  <!-- Card 1: Sigiriya Cultural Tour -->
  <g transform="translate(85, 275)">
    <rect width="190" height="235" rx="14" fill="url(#rtCardBg)" stroke="rgba(0, 198, 255, 0.3)" stroke-width="1.5" />
    <rect x="15" y="15" width="160" height="90" rx="8" fill="#132a45" />
    <!-- Mountain/Rock Landmark Graphic -->
    <path d="M 30,90 L 70,35 L 120,40 L 160,90 Z" fill="#23456b" opacity="0.9" />
    <path d="M 60,90 L 95,45 L 130,90 Z" fill="#325e8f" />
    <circle cx="140" cy="35" r="10" fill="#F59E0B" opacity="0.8" />
    <text x="25" y="32" font-family="'Outfit', sans-serif" font-size="10" font-weight="800" fill="#00C6FF">CULTURAL TRIANGLE</text>
    
    <text x="15" y="128" font-family="'Outfit', sans-serif" font-size="14" font-weight="800" fill="#FFFFFF">Sigiriya &amp; Dambulla</text>
    <text x="15" y="148" font-family="'Outfit', sans-serif" font-size="11" fill="#8BA4C2">Ancient palace fortress, cave temples, village spice tours.</text>
    
    <text x="15" y="185" font-family="'Outfit', sans-serif" font-size="14" font-weight="900" fill="#00C6FF">3 Days / 2 Nights</text>
    <rect x="15" y="195" width="160" height="26" rx="6" fill="rgba(0,198,255,0.2)" stroke="#00C6FF" stroke-width="1" />
    <text x="95" y="212" font-family="'Outfit', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">Explore Itinerary</text>
  </g>

  <!-- Card 2: Ella & Hill Country -->
  <g transform="translate(295, 275)">
    <rect width="190" height="235" rx="14" fill="url(#rtCardBg)" stroke="rgba(245, 158, 11, 0.3)" stroke-width="1.5" />
    <rect x="15" y="15" width="160" height="90" rx="8" fill="#1b2a26" />
    <!-- Tea Hills & Train Arch -->
    <path d="M 15,95 Q 60,60 100,85 Q 140,55 175,95 Z" fill="#1f443b" />
    <path d="M 30,85 C 50,70 120,70 160,85" stroke="#F59E0B" stroke-width="3" fill="none" stroke-dasharray="4,4" />
    <text x="25" y="32" font-family="'Outfit', sans-serif" font-size="10" font-weight="800" fill="#F59E0B">SCENIC HIGHLANDS</text>
    
    <text x="15" y="128" font-family="'Outfit', sans-serif" font-size="14" font-weight="800" fill="#FFFFFF">Ella &amp; Nuwara Eliya</text>
    <text x="15" y="148" font-family="'Outfit', sans-serif" font-size="11" fill="#8BA4C2">Nine Arch bridge train ride, tea plantations, waterfalls.</text>
    
    <text x="15" y="185" font-family="'Outfit', sans-serif" font-size="14" font-weight="900" fill="#F59E0B">4 Days / 3 Nights</text>
    <rect x="15" y="195" width="160" height="26" rx="6" fill="rgba(245,158,11,0.2)" stroke="#F59E0B" stroke-width="1" />
    <text x="95" y="212" font-family="'Outfit', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">Explore Itinerary</text>
  </g>

  <!-- Card 3: Yala Wildlife Safari -->
  <g transform="translate(505, 275)">
    <rect width="205" height="235" rx="14" fill="url(#rtCardBg)" stroke="rgba(0, 198, 255, 0.3)" stroke-width="1.5" />
    <rect x="15" y="15" width="175" height="90" rx="8" fill="#241e17" />
    <!-- Leopard / Safari silhouettes -->
    <circle cx="100" cy="50" r="28" fill="#F59E0B" opacity="0.3" />
    <path d="M 25,95 Q 80,75 140,88 Q 165,70 190,95 Z" fill="#3b2b1a" />
    <text x="25" y="32" font-family="'Outfit', sans-serif" font-size="10" font-weight="800" fill="#FFBD2E">WILDLIFE EXPEDITION</text>
    
    <text x="15" y="128" font-family="'Outfit', sans-serif" font-size="14" font-weight="800" fill="#FFFFFF">Yala Leopard Safari</text>
    <text x="15" y="148" font-family="'Outfit', sans-serif" font-size="11" fill="#8BA4C2">4x4 private jeep safari, wild elephants, coastal wildlife.</text>
    
    <text x="15" y="185" font-family="'Outfit', sans-serif" font-size="14" font-weight="900" fill="#00C6FF">Full Day / Camping</text>
    <rect x="15" y="195" width="175" height="26" rx="6" fill="rgba(0,198,255,0.2)" stroke="#00C6FF" stroke-width="1" />
    <text x="102" y="212" font-family="'Outfit', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">Explore Itinerary</text>
  </g>
</svg>

