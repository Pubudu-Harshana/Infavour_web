<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="cvBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090514" />
      <stop offset="50%" stop-color="#140722" />
      <stop offset="100%" stop-color="#06020c" />
    </linearGradient>
    <linearGradient id="cvRedGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF2E63" />
      <stop offset="100%" stop-color="#FF5E36" />
    </linearGradient>
    <linearGradient id="cvNeonPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7B2FF7" />
      <stop offset="100%" stop-color="#00C6FF" />
    </linearGradient>
    <linearGradient id="cvCardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(35, 15, 60, 0.7)" />
      <stop offset="100%" stop-color="rgba(15, 6, 30, 0.9)" />
    </linearGradient>
    <filter id="cvGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#cvBg)" />

  <!-- Grid overlay -->
  <g opacity="0.12">
    <path d="M0,60 L800,60 M0,120 L800,120 M0,180 L800,180 M0,240 L800,240 M0,300 L800,300 M0,360 L800,360 M0,420 L800,420 M0,480 L800,480 M0,540 L800,540" stroke="#FF2E63" stroke-width="1" />
    <path d="M80,0 L80,600 M160,0 L160,600 M240,0 L240,600 M320,0 L320,600 M400,0 L400,600 M480,0 L480,600 M560,0 L560,600 M640,0 L640,600 M720,0 L720,600" stroke="#7B2FF7" stroke-width="1" />
  </g>

  <!-- Ambient Glow -->
  <circle cx="160" cy="120" r="160" fill="#FF2E63" opacity="0.15" filter="url(#cvGlow)" />
  <circle cx="680" cy="480" r="180" fill="#7B2FF7" opacity="0.18" filter="url(#cvGlow)" />

  <!-- Main App Frame -->
  <rect x="50" y="50" width="700" height="500" rx="18" fill="#0D091D" stroke="rgba(255, 46, 99, 0.3)" stroke-width="1.5" />

  <!-- App Header / Topbar -->
  <rect x="50" y="50" width="700" height="56" rx="18" fill="#130D2A" />
  <circle cx="80" cy="78" r="6" fill="#FF5F56" />
  <circle cx="100" cy="78" r="6" fill="#FFBD2E" />
  <circle cx="120" cy="78" r="6" fill="#27C93F" />

  <!-- Logo and Nav -->
  <text x="160" y="84" font-family="'Outfit', sans-serif" font-size="18" font-weight="900" fill="#FFFFFF" letter-spacing="1">CARVIBES<tspan fill="#FF2E63">.LK</tspan></text>
  <text x="320" y="82" font-family="'Outfit', sans-serif" font-size="12" fill="#FFFFFF" opacity="0.8">Services</text>
  <text x="390" y="82" font-family="'Outfit', sans-serif" font-size="12" fill="#FFFFFF" opacity="0.5">Showroom Packages</text>
  <text x="530" y="82" font-family="'Outfit', sans-serif" font-size="12" fill="#FFFFFF" opacity="0.5">Steam Care</text>
  
  <!-- Book Online Button -->
  <rect x="620" y="66" width="110" height="26" rx="13" fill="url(#cvRedGrad)" />
  <text x="675" y="83" font-family="'Outfit', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">Book Detail</text>

  <!-- Hero Content inside Mockup -->
  <text x="85" y="155" font-family="'Outfit', sans-serif" font-size="28" font-weight="900" fill="#FFFFFF">PREMIUM AUTOMOTIVE CARE</text>
  <text x="85" y="185" font-family="'Outfit', sans-serif" font-size="14" fill="#FF2E63" font-weight="600" letter-spacing="2">SRI LANKA'S ELITE DETAILING STUDIO</text>
  <text x="85" y="215" font-family="'Outfit', sans-serif" font-size="13" fill="#A0A0C0" width="300">Nano ceramic coating, precision exterior restoration, and deep steam interior sanitization.</text>

  <!-- Car silhouette / Neon Graphic Accent -->
  <path d="M 460,210 Q 510,165 590,160 Q 670,160 700,200 L 710,225 L 430,225 Z" fill="none" stroke="url(#cvRedGrad)" stroke-width="3" filter="url(#cvGlow)" />
  <path d="M 440,225 L 720,225" stroke="#00C6FF" stroke-width="2" />
  <circle cx="490" cy="225" r="16" fill="#140722" stroke="#FF2E63" stroke-width="3" />
  <circle cx="660" cy="225" r="16" fill="#140722" stroke="#FF2E63" stroke-width="3" />

  <!-- Service Cards Row -->
  <!-- Card 1: Ceramic Coating -->
  <g transform="translate(85, 270)">
    <rect width="185" height="240" rx="14" fill="url(#cvCardBg)" stroke="rgba(255, 46, 99, 0.4)" stroke-width="1.5" />
    <rect x="18" y="20" width="40" height="40" rx="10" fill="rgba(255,46,99,0.15)" />
    <path d="M 38,30 L 46,45 L 30,45 Z" fill="#FF2E63" />
    <text x="18" y="85" font-family="'Outfit', sans-serif" font-size="15" font-weight="800" fill="#FFFFFF">9H Ceramic Shield</text>
    <text x="18" y="108" font-family="'Outfit', sans-serif" font-size="11" fill="#9D9AB4">Diamond gloss finish, scratch protection &amp; hydrophobic seal.</text>
    <text x="18" y="170" font-family="'Outfit', sans-serif" font-size="18" font-weight="900" fill="#FF2E63">3 Years <tspan font-size="11" fill="#7E7A96">warranty</tspan></text>
    <rect x="18" y="195" width="149" height="28" rx="7" fill="rgba(255,46,99,0.2)" stroke="#FF2E63" stroke-width="1" />
    <text x="92" y="213" font-family="'Outfit', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">Select Package</text>
  </g>

  <!-- Card 2: Paint Correction -->
  <g transform="translate(290, 270)">
    <rect width="185" height="240" rx="14" fill="url(#cvCardBg)" stroke="rgba(123, 47, 247, 0.4)" stroke-width="1.5" />
    <rect x="18" y="20" width="40" height="40" rx="10" fill="rgba(123,47,247,0.15)" />
    <circle cx="38" cy="40" r="12" fill="none" stroke="#7B2FF7" stroke-width="3" />
    <text x="18" y="85" font-family="'Outfit', sans-serif" font-size="15" font-weight="800" fill="#FFFFFF">Paint Correction</text>
    <text x="18" y="108" font-family="'Outfit', sans-serif" font-size="11" fill="#9D9AB4">Multi-stage swirl removal, mirror optical clarity restoration.</text>
    <text x="18" y="170" font-family="'Outfit', sans-serif" font-size="18" font-weight="900" fill="#7B2FF7">99% Swirl Free</text>
    <rect x="18" y="195" width="149" height="28" rx="7" fill="rgba(123,47,247,0.2)" stroke="#7B2FF7" stroke-width="1" />
    <text x="92" y="213" font-family="'Outfit', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">Select Package</text>
  </g>

  <!-- Card 3: Deep Interior Steam -->
  <g transform="translate(495, 270)">
    <rect width="215" height="240" rx="14" fill="url(#cvCardBg)" stroke="rgba(0, 198, 255, 0.4)" stroke-width="1.5" />
    <rect x="18" y="20" width="40" height="40" rx="10" fill="rgba(0,198,255,0.15)" />
    <path d="M 32,45 Q 38,35 34,28 M 40,45 Q 46,35 42,28 M 48,45 Q 54,35 50,28" stroke="#00C6FF" stroke-width="2.5" fill="none" />
    <text x="18" y="85" font-family="'Outfit', sans-serif" font-size="15" font-weight="800" fill="#FFFFFF">Steam Sanitation</text>
    <text x="18" y="108" font-family="'Outfit', sans-serif" font-size="11" fill="#9D9AB4">180°C hot vapor sterilization, leather conditioning &amp; cabin detox.</text>
    <text x="18" y="170" font-family="'Outfit', sans-serif" font-size="18" font-weight="900" fill="#00C6FF">100% Germ Free</text>
    <rect x="18" y="195" width="179" height="28" rx="7" fill="rgba(0,198,255,0.2)" stroke="#00C6FF" stroke-width="1" />
    <text x="107" y="213" font-family="'Outfit', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">Select Package</text>
  </g>
</svg>

